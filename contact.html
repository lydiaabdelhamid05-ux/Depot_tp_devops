<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Site DevOps - Contact</title>
  <link rel="stylesheet" href="css/ligne.css">
</head>
<body>

  <!-- Barre de navigation -->
  <header>
    <nav class="navbar">
      <div class="logo">DevOps Project</div>
      <ul class="nav-links">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contactez-nous</h1>
    <p>Une question ou une suggestion ? Remplissez le formulaire ci-dessous.</p>

    <div class="ligne_graphique">
      <h2 class="titre_ligne">Formulaire de Contact</h2>
      <form class="contact-form" action="#" method="post">
        <div class="form-group">
          <label for="name">Nom :</label>
          <input type="text" id="name" name="name" placeholder="Votre nom" required>
        </div>
        
        <div class="form-group">
          <label for="email">E-mail :</label>
          <input type="email" id="email" name="email" placeholder="votre.email@example.com" required>
        </div>

        <div class="form-group">
          <label for="message">Message :</label>
          <textarea id="message" name="message" rows="4" placeholder="Votre message..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Envoyer</button>
      </form>
    </div>
  </main>

</body>
</html>
