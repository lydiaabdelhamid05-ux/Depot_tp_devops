<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Formulaire d'inscription</title>
    <style>
    	.valid {
        	color: green;
        	font-weight: bold;
    	}

    	.invalid {
        	color: red;
        	font-weight: bold;
    	}
    </style>
</head>

<body>

    <h1>Inscription</h1>

    <form id="monFormulaire">
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" required>
	    <p id="passwordRequirements">
  		Le mot de passe doit contenir au moins 8 caractères,
  		une lettre, un chiffre et un caractère spécial.
	    </p>
	    <p id="passwordFeedback"></p>
        </div>

        <button type="submit" id="submitBtn" disabled>
            S'inscrire
        </button>
    </form>

    <script>
        function validerMotDePasse(motDePasse) {
            // Au moins 8 caractères, une lettre et un chiffre
            const regex = /^(?=.[A-Za-z])(?=.\d)(?=.*[.&#\-_]).{8,}$/;
            return regex.test(motDePasse);
        }

        const inputPassword = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const passwordFeedback = document.getElementById('passwordFeedback');
        inputPassword.addEventListener('input', (e) => {
            const estValide = validerMotDePasse(e.target.value);

	    if (estValide) {
        	passwordFeedback.textContent = "Mot de passe valide";
    	        passwordFeedback.className = "valid";
	    } else {
        	passwordFeedback.textContent = "Mot de passe invalide";
    	        passwordFeedback.className = "invalid";
            }
            
	    submitBtn.disabled = !estValide;
        });
    </script>

</body>
</html>
