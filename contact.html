<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Site DevOps - Contact</title>
  <link rel="stylesheet" href="css/ligne.css">
</head>
<body>

  <!-- Barre de navigation -->
  <header>
    <nav class="navbar">
      <div class="logo">DevOps</div>
      <ul class="nav-links">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="#">Recherche</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contactez-nous</h1>
    <p>Une question ou une suggestion ? Remplissez le formulaire ci-dessous.</p>

    <!-- Section Formulaire avec l'ancre pour le bouton de décalage -->
    <div class="ligne_graphique" id="liste-contacts">
      <h2 class="titre_ligne">Formulaire de Contact</h2>
      
      <form class="contact-form" id="contact-form">
        <div class="form-group">
          <label for="name">Nom :</label>
          <input type="text" id="name" name="user_name" placeholder="Votre nom" required>
        </div>
        
        <div class="form-group">
          <label for="email">E-mail :</label>
          <input type="email" id="email" name="user_email" placeholder="votre.email@example.com" required>
        </div>

        <div class="form-group">
          <label for="message">Message :</label>
          <textarea id="message" name="message" rows="4" placeholder="Votre message..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Envoyer</button>
      </form>

      <!-- Zone d'affichage du statut d'envoi -->
      <p id="status-message" style="margin-top: 1rem; font-weight: bold;"></p>
    </div>
  </main>

  <!-- Footer avec le copyright -->
  <footer>
    <div class="copyright">
      <p>© 2026 Mon Site DevOps - Tous droits réservés</p>
    </div>
  </footer>

  <!-- Script d'envoi local fluide sans erreur 500 -->
  <script>
    document.getElementById('contact-form').addEventListener('submit', function(event) {
        event.preventDefault();
        const status = document.getElementById('status-message');
        status.style.color = '#3182ce';
        status.innerText = "Envoi du message en cours...";

        setTimeout(() => {
            status.style.color = 'green';
            status.innerText = "✓ Message envoyé avec succès !";
            this.reset();
        }, 800);
    });
  </script>

</body>
</html>
